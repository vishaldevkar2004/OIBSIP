<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Registration - Digital Library</title>


<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: Arial, sans-serif;
}

body {
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 30px 20px;
	background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
		url("/images/library-bg.png");
	background-size: cover;
	background-position: center;
	background-repeat: no-repeat;
}

.register-container {
	width: 100%;
	max-width: 460px;
	background: rgba(255, 255, 255, 0.97);
	padding: 38px 40px;
	border-radius: 14px;
	box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
}

.logo {
	text-align: center;
	font-size: 26px;
	font-weight: bold;
	color: #2563eb;
	margin-bottom: 8px;
}

.logo span {
	color: #111827;
}

.heading {
	text-align: center;
	margin-bottom: 28px;
}

.heading h2 {
	color: #111827;
	font-size: 26px;
	margin-bottom: 8px;
}

.heading p {
	color: #6b7280;
	font-size: 14px;
}

.form-group {
	margin-bottom: 18px;
}

.form-group label {
	display: block;
	margin-bottom: 7px;
	font-size: 14px;
	font-weight: 600;
	color: #374151;
}

.form-group input {
	width: 100%;
	padding: 12px 14px;
	border: 1px solid #d1d5db;
	border-radius: 7px;
	font-size: 15px;
	outline: none;
	transition: 0.3s;
}

.form-group input:focus {
	border-color: #2563eb;
	box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
}

.register-btn {
	width: 100%;
	border: none;
	background: #2563eb;
	color: white;
	padding: 13px;
	border-radius: 7px;
	font-size: 16px;
	font-weight: 600;
	cursor: pointer;
	margin-top: 8px;
	transition: 0.3s;
}

.register-btn:hover {
	background: #1d4ed8;
	transform: translateY(-1px);
}

.login-text {
	text-align: center;
	margin-top: 22px;
	color: #6b7280;
	font-size: 14px;
}

.login-text a {
	color: #2563eb;
	text-decoration: none;
	font-weight: 600;
}

.login-text a:hover {
	text-decoration: underline;
}

.back-home {
	text-align: center;
	margin-top: 16px;
}

.back-home a {
	text-decoration: none;
	color: #6b7280;
	font-size: 13px;
}

.back-home a:hover {
	color: #2563eb;
}

/* ================= MOBILE ================= */
@media ( max-width : 480px) {
	body {
		padding: 20px 15px;
	}
	.register-container {
		padding: 30px 24px;
		border-radius: 12px;
	}
	.logo {
		font-size: 23px;
	}
	.heading h2 {
		font-size: 23px;
	}
}
</style>

</head>


<body>


	<div class="register-container">


		<div class="logo">

			Digital<span>Library</span>

		</div>


		<div class="heading">

			<h2>Create Your Account</h2>


			<p>Join our digital library and start exploring books.</p>

		</div>


		<form action="/register" method="post">


			<div class="form-group">

				<label for="fullName"> Full Name </label> <input type="text"
					id="fullName" name="fullName" placeholder="Enter your full name"
					required>

			</div>



			<div class="form-group">

				<label for="email"> Email Address </label> <input type="email"
					id="email" name="email" placeholder="Enter your email" required>

			</div>



			<div class="form-group">

				<label for="password"> Password </label> <input type="password"
					id="password" name="password" placeholder="Create a password"
					required>

			</div>

			<div class="form-group">

				<label for="retypePassword"> Retype Password </label> <input
					type="password" id="retypePassword" name="retypePassword"
					placeholder="Retype your password" required>

			</div>



			<div class="form-group">

				<label for="phone"> Phone Number </label> <input type="tel"
					id="phone" name="phone" placeholder="Enter your phone number">

			</div>



			<button type="submit" class="register-btn">Create Account</button>


		</form>


		<div class="login-text">

			Already have an account? <a href="/login"> Login </a>

		</div>


		<div class="back-home">

			<a href="/"> ← Back to Home </a>

		</div>


	</div>

	<script>
		document.querySelector("form").addEventListener(
				"submit",
				function(event) {

					const password = document.getElementById("password").value;
					const retypePassword = document
							.getElementById("retypePassword").value;

					if (password !== retypePassword) {

						event.preventDefault();

						alert("Passwords do not match!");

					}

				});
	</script>


</body>

</html>
