<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Login - Digital Library</title>


<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: Arial, sans-serif;
}

body {
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 30px 20px;
	background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
		url("/images/library-bg.png");
	background-size: cover;
	background-position: center;
	background-repeat: no-repeat;
}

.login-container {
	width: 100%;
	max-width: 430px;
	background: rgba(255, 255, 255, 0.97);
	padding: 40px;
	border-radius: 14px;
	box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
}

.logo {
	text-align: center;
	font-size: 26px;
	font-weight: bold;
	color: #2563eb;
	margin-bottom: 8px;
}

.logo span {
	color: #111827;
}

.heading {
	text-align: center;
	margin-bottom: 28px;
}

.heading h2 {
	color: #111827;
	font-size: 26px;
	margin-bottom: 8px;
}

.heading p {
	color: #6b7280;
	font-size: 14px;
}

.form-group {
	margin-bottom: 20px;
}

.form-group label {
	display: block;
	margin-bottom: 7px;
	font-size: 14px;
	font-weight: 600;
	color: #374151;
}

.form-group input {
	width: 100%;
	padding: 13px 14px;
	border: 1px solid #d1d5db;
	border-radius: 7px;
	font-size: 15px;
	outline: none;
	transition: 0.3s;
}

.form-group input:focus {
	border-color: #2563eb;
	box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
}

.login-btn {
	width: 100%;
	border: none;
	background: #2563eb;
	color: white;
	padding: 13px;
	border-radius: 7px;
	font-size: 16px;
	font-weight: 600;
	cursor: pointer;
	transition: 0.3s;
}

.login-btn:hover {
	background: #1d4ed8;
	transform: translateY(-1px);
}

.register-text {
	text-align: center;
	margin-top: 22px;
	color: #6b7280;
	font-size: 14px;
}

.register-text a {
	color: #2563eb;
	text-decoration: none;
	font-weight: 600;
}

.register-text a:hover {
	text-decoration: underline;
}

.back-home {
	text-align: center;
	margin-top: 16px;
}

.back-home a {
	text-decoration: none;
	color: #6b7280;
	font-size: 13px;
}

.back-home a:hover {
	color: #2563eb;
}

/* Login Error */
.error-message {
	background: #fee2e2;
	color: #b91c1c;
	border: 1px solid #fecaca;
	padding: 10px 12px;
	border-radius: 6px;
	margin-bottom: 18px;
	text-align: center;
	font-size: 14px;
}

/* Logout Message */
.logout-message {
	background: #dcfce7;
	color: #166534;
	border: 1px solid #bbf7d0;
	padding: 10px 12px;
	border-radius: 6px;
	margin-bottom: 18px;
	text-align: center;
	font-size: 14px;
}

/* Mobile */
@media ( max-width : 480px) {
	body {
		padding: 20px 15px;
	}
	.login-container {
		padding: 30px 24px;
		border-radius: 12px;
	}
	.logo {
		font-size: 23px;
	}
	.heading h2 {
		font-size: 23px;
	}
}
</style>

</head>


<body>


	<div class="login-container">


		<div class="logo">

			Digital<span>Library</span>

		</div>


		<div class="heading">

			<h2>Welcome Back</h2>


			<p>Login to access your digital library.</p>

		</div>


		<!-- Login Error -->

		<div class="error-message" th:if="${param.error}">Invalid email
			or password.</div>


		<!-- Logout Message -->

		<div class="logout-message" th:if="${param.logout}">You have
			been logged out successfully.</div>


		<form action="/login" method="post">


			<div class="form-group">

				<label for="email"> Email Address </label>


				<!-- Spring Security expects username -->

				<input type="email" id="email" name="username"
					placeholder="Enter your email" required>

			</div>


			<div class="form-group">

				<label for="password"> Password </label> <input type="password"
					id="password" name="password" placeholder="Enter your password"
					required>

			</div>


			<button type="submit" class="login-btn">Login</button>


		</form>


		<div class="register-text">

			Don't have an account? <a href="/register"> Create Account </a>

		</div>


		<div class="back-home">

			<a href="/"> ← Back to Home </a>

		</div>


	</div>


</body>

</html>
